<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Merci pour votre demande | PS Extérieur & Électricité</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">

  <link rel="stylesheet" href="style.css">

  <style>
    .merci-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(
        to bottom,
        #87ceeb 0%,
        #f5f5f5 60%,
        #ffffff 100%
      );
      text-align: center;
      padding: 20px;
    }

    .merci-box {
      background: white;
      padding: 50px 40px;
      border-radius: 12px;
      max-width: 600px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    }

    .merci-box img {
      width: 220px;
      margin-bottom: 30px;
    }

    .merci-box h1 {
      font-size: 2.2rem;
      margin-bottom: 20px;
      color: #111;
    }

    .merci-box p {
      font-size: 1.1rem;
      color: #444;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .merci-box a {
      display: inline-block;
      background: #f2b705;
      color: #000;
      padding: 14px 26px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
    }
  </style>
</head>

<body>

<div class="merci-container">
  <div class="merci-box">

    <img src="images/logo.png" alt="PS Extérieur & Électricité">

    <h1>Merci pour votre demande !</h1>

    <p>
      Votre demande de devis a bien été envoyée.<br><br>
      Nous reviendrons vers vous dans les plus brefs délais
      afin d’analyser votre projet et vous proposer une solution adaptée.
    </p>

    <a href="index.html">Retour au site</a>

  </div>
</div>

</body>
</html>
